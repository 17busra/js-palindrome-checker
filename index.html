<!DOCTYPE html>
<html>
<head>
  <title>Palindrome Checker</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
    }

    #result {
      margin-top: 20px;
      font-size: 18px;
      white-space: pre-line;
    }
  </style>
</head>
<body>
  <h2>Palindrome Checker</h2>

  <div id="result"></div>

  <script>
    function checkPalindrome(word) {
      const input = word.trim().toLowerCase();
      const len = input.length;
      let output = "";
      let isPalindrome = true;

      for (let i = 0; i < Math.floor(len / 2); i++) {
        const left = input[i];
        const right = input[len - 1 - i];

        if (left === right) {
          output += `${left} == ${right}\n`;
        } else {
          output += `${left} != ${right}\n`;
          isPalindrome = false;
        }
      }

      // Tek harfli merkez kontrolü
      if (len % 2 !== 0) {
        const mid = Math.floor(len / 2);
        output += `${input[mid]} == ${input[mid]}\n`;
      }

      if (isPalindrome) {
        output += `\nSo ${input} is a palindrome!`;
      } else {
        output += `\nSo ${input} is not a palindrome.`;
      }

      return output;
    }

    // Kullanıcıdan kelimeyi prompt ile al
    const userWord = prompt("Enter a word to check if it's a palindrome:");
    const resultDiv = document.getElementById("result");

    if (!userWord || userWord.trim() === "") {
      resultDiv.textContent = "No input provided.";
    } else {
      resultDiv.textContent = checkPalindrome(userWord);
    }
  </script>
</body>
</html>
